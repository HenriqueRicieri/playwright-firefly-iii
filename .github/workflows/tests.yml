name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repeat_each:
        description: Run every test N times to catch flaky tests
        default: '1'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (no browser, no Firefly)
        run: npx playwright test --project=unit --reporter=list

  e2e:
    name: ${{ matrix.browser }}
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # API tests are browser independent, so they run once, next to Chromium.
          - browser: chromium
            projects: --project=api --project=e2e-chromium
          - browser: firefox
            projects: --project=e2e-firefox
          - browser: webkit
            projects: --project=e2e-webkit
    steps:
      - uses: actions/checkout@v7

      - name: Start Firefly III (pinned version, empty database)
        run: docker compose -f docker/compose.yml up -d --wait

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install browsers (the setup step always uses Chromium)
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Run tests
        run: npx playwright test ${{ matrix.projects }} --repeat-each=${{ inputs.repeat_each || 1 }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.browser }}
          path: blob-report/
          retention-days: 3

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14

      - name: Firefly III logs
        if: failure()
        run: docker compose -f docker/compose.yml logs app --tail 200

  report:
    name: Merge reports
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
