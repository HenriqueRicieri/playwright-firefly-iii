name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repeat_each:
        description: Run every test N times to catch flaky tests
        default: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start Firefly III (pinned version, empty database)
        run: docker compose -f docker/compose.yml up -d --wait

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Run tests
        run: npx playwright test --repeat-each=${{ inputs.repeat_each || 1 }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Firefly III logs
        if: failure()
        run: docker compose -f docker/compose.yml logs app --tail 200
