# Updates arrive as pull requests, and CI runs the whole suite on each one before anything is merged.
# That includes Firefly III itself: a new version is a conscious upgrade that has to pass the tests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ['*']
    ignore:
      # TypeScript 7 (the Go rewrite) is not supported by typescript-eslint yet. Revisit when it is.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # The test database follows MariaDB's long-term support line, as Firefly's own compose file does
      # (mariadb:lts). Minor and patch updates are welcome; a new major line is a manual decision.
      - dependency-name: mariadb
        update-types: ['version-update:semver-major']
